<!doctype html>
<html><head><meta charset="utf-8"><title>GestureOS bridge test</title>
<style>body{font:14px system-ui;margin:20px;max-width:720px}#pad{width:400px;height:225px;border:1px solid #888;margin:10px 0;cursor:crosshair}button{margin:2px}pre{background:#f4f4f4;padding:8px;height:200px;overflow:auto}</style>
</head><body>
<h3>GestureOS bridge test client</h3>
<input id="url" value="ws://localhost:8765" size="28"> <button id="connect">Connect</button>
<span id="status">disconnected</span>
<p>Move the mouse over the box to send <code>move</code> (normalized to the box).</p>
<div id="pad"></div>
<button data-m='{"type":"click","button":"left"}'>click</button>
<button data-m='{"type":"click","button":"left","double":true}'>double</button>
<button data-m='{"type":"click","button":"right"}'>right click</button>
<button data-m='{"type":"scroll","dy":3}'>scroll down</button>
<button data-m='{"type":"scroll","dy":-3}'>scroll up</button>
<button data-m='{"type":"key","key":"right"}'>key →</button>
<button data-m='{"type":"hotkey","keys":["alt","tab"]}'>alt+tab</button>
<button data-m='{"type":"key","key":"f4"}'>blocked key</button>
<button data-m='{"type":"ping","id":1}'>ping</button>
<button data-m='{"type":"kill"}' style="color:#b00">KILL</button>
<button data-m='{"type":"resume"}'>resume</button>
<pre id="log"></pre>
<script>
let ws;const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent=t+'\n'+$('log').textContent;};
const send=m=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(m));if(m.type!=='move')log('-> '+JSON.stringify(m));}};
$('connect').onclick=()=>{ws=new WebSocket($('url').value);
  ws.onopen=()=>{$('status').textContent='connected';send({type:'hello',app:'test_client',version:1});};
  ws.onmessage=e=>log('<- '+e.data);
  ws.onclose=e=>{$('status').textContent='closed '+e.code+' '+e.reason;};};
let last=0;
$('pad').onmousemove=e=>{const now=performance.now();if(now-last<16)return;last=now;
  const r=$('pad').getBoundingClientRect();send({type:'move',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});};
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>send(JSON.parse(b.dataset.m)));
</script></body></html>
